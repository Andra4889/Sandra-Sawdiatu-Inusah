
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sandra Sawdiatu Inusah — Geospatial Analyst, Conservationist and Environmental Researcher">
<title>Sandra Sawdiatu Inusah | Portfolio</title>

<style>
:root {
  --navy: #102a43;
  --dark: #071e3d;
  --teal: #008b91;
  --aqua: #23aaa8;
  --cream: #f7faf9;
  --light: #e8f5f4;
  --text: #263d4b;
  --muted: #617783;
  --border: #dce6e5;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 85px;
}

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background: white;
  line-height: 1.75;
}

a { color: var(--teal); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; display: block; }

.container {
  width: min(1150px, 90%);
  margin: auto;
}

section { padding: 75px 0; }
.light { background: var(--cream); }
.center { text-align: center; }

h1, h2, h3, h4 {
  color: var(--navy);
  line-height: 1.3;
}

h2 {
  font-size: clamp(1.8rem, 3vw, 2.5rem);
  margin: 5px 0 25px;
}

h3 { font-size: 1.2rem; margin-bottom: 8px; }
p { margin-top: 0; }

.eyebrow {
  color: var(--teal);
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* NAVIGATION */

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,.97);
  border-bottom: 1px solid var(--border);
}

nav {
  min-height: 74px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.logo {
  font-weight: 800;
  font-size: 1.2rem;
  color: var(--navy);
  white-space: nowrap;
}

.logo span { color: var(--teal); }

.navlinks {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}

.navlinks a {
  color: var(--navy);
  font-size: .84rem;
  font-weight: 600;
}

.navlinks a:hover { color: var(--teal); }

.menu {
  display: none;
  border: none;
  background: transparent;
  font-size: 1.6rem;
  cursor: pointer;
}

/* HERO */

.hero {
  position: relative;
  min-height: 680px;
  display: flex;
  align-items: center;
  padding: 75px 6%;
  color: white;
  background-image:
    linear-gradient(
      90deg,
      rgba(4,24,23,.80) 0%,
      rgba(4,24,23,.60) 50%,
      rgba(4,24,23,.18) 100%
    ),
    url("Portfolio/Background.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.hero-inner {
  width: 100%;
  max-width: 1450px;
  margin: auto;
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  align-items: center;
  gap: 55px;
}

.hero-content { min-width: 0; }

.hero-eyebrow {
  color: #91f2e5;
  font-size: 15px;
  font-weight: 750;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 18px;
}

.hero h1 {
  color: white;
  font-size: clamp(35px, 4vw, 62px);
  line-height: 1.12;
  letter-spacing: -1.5px;
  margin: 0 0 20px;
  font-weight: 800;
}

.hero-tagline {
  color: #91f2e5;
  font-size: clamp(22px, 2.3vw, 32px);
  line-height: 1.25;
  font-weight: 700;
  margin-bottom: 23px;
}

.hero-description {
  color: white;
  font-size: 18px;
  line-height: 1.7;
  max-width: 780px;
  margin-bottom: 24px;
}

.hero-availability {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: 1.5px solid #78efcf;
  border-radius: 50px;
  color: #8df5d8;
  background: rgba(0,40,32,.4);
  padding: 10px 17px;
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 21px;
}

.availability-dot {
  width: 10px;
  height: 10px;
  background: #63edb8;
  border-radius: 50%;
}

.hero-specialties {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 25px;
}

.specialty {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  border: 1px solid rgba(255,255,255,.6);
  background: rgba(10,30,25,.3);
  border-radius: 25px;
  padding: 10px 15px;
  color: white;
  font-size: 14px;
  font-weight: 650;
}

.specialty svg { width: 19px; height: 19px; }

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 25px;
}

.hero-button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  padding: 14px 26px;
  border-radius: 11px;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  transition: transform .2s, background .2s;
}

.hero-button:hover {
  transform: translateY(-2px);
  text-decoration: none;
}

.hero-button.primary {
  background: #009f9b;
  color: white;
}

.hero-button.secondary {
  border: 2px solid white;
  background: rgba(0,0,0,.16);
  color: white;
}

.hero-socials {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  align-items: center;
}

.hero-socials a {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: white;
  font-size: 14px;
  font-weight: 600;
}

.hero-socials a:hover { color: #91f2e5; }
.hero-socials svg { width: 24px; height: 24px; }

.hero-photo {
  display: flex;
  justify-content: center;
}

.hero-photo img {
  width: 100%;
  max-width: 440px;
  height: 510px;
  object-fit: cover;
  object-position: center top;
  border-radius: 25px;
  border: 2px solid rgba(255,255,255,.85);
  box-shadow: 0 15px 45px rgba(0,0,0,.24);
}

/* ABOUT */

#about {
  background: white;
  padding: 85px 0 90px;
}

.about-container {
  width: min(1450px, 92%);
  margin: auto;
}

.about-layout {
  display: grid;
  grid-template-columns: 36% 1fr;
  align-items: center;
  gap: 60px;
}

.about-image {
  width: 100%;
  height: 600px;
  object-fit: cover;
  border-radius: 36px;
  box-shadow: 0 14px 28px rgba(0,0,0,.14);
}

.about-kicker {
  color: var(--teal);
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 3px;
  margin-bottom: 25px;
}

.about-heading {
  font-family: Georgia, "Times New Roman", serif;
  color: var(--dark);
  font-size: clamp(36px, 4vw, 60px);
  line-height: 1.15;
  margin: 0 0 12px;
}

.about-underline {
  width: 230px;
  height: 5px;
  background: linear-gradient(90deg,var(--teal),#60c9c5);
  border-radius: 100%;
  margin-bottom: 35px;
}

.about-copy p {
  color: var(--dark);
  font-size: clamp(16px, 1.35vw, 19px);
  line-height: 1.65;
  margin-bottom: 20px;
}

.about-copy strong {
  color: #007b80;
  font-weight: 800;
}

.about-pillars {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  margin-top: 50px;
  padding: 30px 22px;
  background: #e8f6f5;
  border-radius: 26px;
}

.about-pillar {
  position: relative;
  padding: 0 25px;
}

.about-pillar:not(:last-child) {
  border-right: 1px solid #30aaa9;
}

.about-pillar svg {
  width: 48px;
  height: 48px;
  color: var(--teal);
  stroke-width: 1.8;
  margin-bottom: 10px;
}

.about-pillar h3 {
  color: var(--dark);
  font-size: 19px;
  margin: 0 0 7px;
  font-weight: 800;
}

.about-pillar p {
  color: var(--dark);
  font-size: 15px;
  line-height: 1.5;
  margin: 0;
}

/* GENERAL CARDS */

.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 24px;
  margin-top: 30px;
}

.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  transition: .2s;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 28px #102a4315;
}

.card-body { padding: 25px; }

.tag {
  display: inline-block;
  padding: 5px 10px;
  background: #dcefeb;
  color: #06616b;
  font-size: .76rem;
  font-weight: 700;
  border-radius: 5px;
}

.feature {
  background: white;
  padding: 30px;
  border: 1px solid var(--border);
  border-radius: 14px;
}

/* PROJECTS */

#projects .project-card {
  display: flex;
  flex-direction: column;
  height: 100%;
}

#projects .project-image-wrap {
  width: 100%;
  height: 230px;
  overflow: hidden;
  background: #e8f5f4;
}

#projects .project-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  transition: transform .3s ease;
}

#projects .project-card:hover .project-image {
  transform: scale(1.04);
}

#projects .project-card .card-body {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding: 25px;
}

#projects .project-card .tag {
  align-self: flex-start;
  margin-bottom: 10px;
}

#projects .project-card h3 {
  margin: 12px 0 14px;
  font-size: 1.25rem;
}

#projects .project-card p { margin-bottom: 17px; }

#projects .project-links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: auto;
  padding-top: 12px;
}

.project-link,
.education-profile-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 15px;
  background: #e1f0ed;
  color: #086c71;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 750;
  text-decoration: none;
  transition: background .2s, color .2s, transform .2s;
}

.project-link:hover,
.education-profile-link:hover {
  background: var(--teal);
  color: white;
  transform: translateY(-2px);
  text-decoration: none;
}

/* EXPERIENCE */

.timeline {
  border-left: 3px solid var(--teal);
  padding-left: 30px;
  margin-left: 10px;
}

.job {
  position: relative;
  padding-bottom: 28px;
}

.job::before {
  content: "";
  position: absolute;
  left: -39px;
  top: 8px;
  width: 13px;
  height: 13px;
  background: var(--teal);
  border: 3px solid white;
  border-radius: 50%;
}

.date {
  color: var(--teal);
  font-weight: 700;
  font-size: .88rem;
}

.job h3 { margin: 6px 0; }
.job h4 { color: var(--muted); margin: 0 0 10px; }

.job ul,
.feature ul {
  padding-left: 22px;
}

/* RESEARCH PREVIEW */

#research {
  background: #f4f8f8;
}

#research .container {
  width: min(1450px,90%);
}

#research h2 {
  font-size: clamp(30px,4vw,56px);
  margin: 14px 0 32px;
  color: var(--navy);
  line-height: 1.2;
  font-weight: 800;
}

.research-preview {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 55px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 34px 50px;
  box-shadow: 0 15px 35px rgba(16,42,67,.035);
}

.research-map {
  display: flex;
  justify-content: center;
  align-items: center;
}

.research-map img {
  width: 100%;
  max-height: 450px;
  object-fit: contain;
}

.research-label {
  display: inline-block;
  background: #e0f2ef;
  color: #066b77;
  padding: 10px 15px;
  border-radius: 9px;
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 18px;
}

.research-content h3 {
  color: var(--navy);
  font-size: clamp(26px,2.8vw,38px);
  font-weight: 800;
  line-height: 1.2;
  margin: 0 0 20px;
}

.research-content p {
  color: var(--text);
  font-size: clamp(16px,1.3vw,19px);
  line-height: 1.8;
  margin-bottom: 24px;
}

.research-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: var(--teal);
  color: white;
  padding: 15px 24px;
  border-radius: 10px;
  font-size: 18px;
  font-weight: 800;
}

.research-button:hover {
  background: #006e75;
  color: white;
  text-decoration: none;
}

/* PUBLICATIONS */

.publication {
  padding: 18px 0;
  border-bottom: 1px solid var(--border);
}

/* LIFE BEYOND RESEARCH */

.life-photo {
  margin: 35px auto 0;
  width: 100%;
  max-width: 500px;
  overflow: hidden;
  border-radius: 20px;
}

.life-photo img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 20px;
}

.life-caption {
  margin-top: 15px;
  text-align: center;
  font-size: 14px !important;
  font-style: italic;
  color: #617783;
}

/* CONTACT */

.contact {
  background: var(--navy);
  color: white;
}

.contact h2 { color: white; }
.contact .eyebrow { color: #8ce0d8; }

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}

.contact .buttons { justify-content: center; }

.btn {
  display: inline-block;
  padding: 12px 23px;
  border-radius: 9px;
  font-weight: 700;
}

.btn.primary {
  background: var(--teal);
  color: white;
}

.btn.outline {
  border: 2px solid white;
  color: white;
}

footer {
  background: #091d30;
  color: #dce6e5;
  padding: 25px 0;
}

.footer-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
}

footer a { color: #8ce0d8; }

/* RESPONSIVE DESIGN */

@media(max-width:1100px) {
  .about-layout {
    grid-template-columns: 40% 1fr;
    gap: 35px;
  }

  .about-image { height: 520px; }

  .about-pillars {
    grid-template-columns: repeat(2,1fr);
    gap: 25px;
  }

  .about-pillar:nth-child(2) { border-right: none; }
}

@media(max-width:900px) {
  .menu { display: block; }

  .navlinks {
    display: none;
    position: absolute;
    top: 74px;
    left: 0;
    right: 0;
    padding: 20px 5%;
    background: white;
    box-shadow: 0 10px 20px #0002;
    flex-direction: column;
  }

  .navlinks.open { display: flex; }

  .hero { padding: 60px 6%; }

  .hero-inner {
    grid-template-columns: 1fr;
    gap: 35px;
  }

  .hero-photo { justify-content: flex-start; }

  .hero-photo img {
    max-width: 380px;
    height: 420px;
  }

  .about-layout { grid-template-columns: 1fr; }

  .about-image {
    max-width: 550px;
    height: 500px;
  }

  .research-preview {
    grid-template-columns: 1fr;
    gap: 25px;
    padding: 25px;
  }
}

@media(max-width:600px) {
  section { padding: 55px 0; }

  .hero { padding: 55px 5%; }
  .hero h1 { font-size: 34px; }
  .hero-description { font-size: 16px; }

  .hero-photo img {
    max-width: 100%;
    height: 380px;
  }

  #about { padding: 55px 0; }

  .about-image {
    height: 420px;
    border-radius: 22px;
  }

  .about-heading { font-size: 38px; }

  .about-pillars {
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 25px;
  }

  .about-pillar {
    padding: 0 0 20px;
    border-right: none !important;
    border-bottom: 1px solid #9bd8d5;
  }

  .about-pillar:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .grid { grid-template-columns: 1fr; }

  .research-preview {
    padding: 20px;
    border-radius: 18px;
  }

  .research-content p { font-size: 16px; }
  .research-button { font-size: 16px; }

  .footer-row { flex-direction: column; }
}
</style>
</head>

<body id="top">
